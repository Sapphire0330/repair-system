<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f5fa8">
  <meta name="description" content="填寫報修表單並查看最近 20 筆報修。">
  <!-- PWA：安裝到主畫面 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="報修登記">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>報修登記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p class="subtitle">填寫下方表單送出報修，送出後會出現在清單中。</p>
  </header>

  <main>
    <div id="offline-banner" class="banner offline" role="status" hidden>
      目前離線：可以瀏覽畫面，但無法送出報修或更新清單。
    </div>

    <div id="install-banner" class="banner install" hidden>
      <p id="install-text">把「報修登記」安裝到手機主畫面，之後像 App 一樣一鍵開啟。</p>
      <div class="banner-actions">
        <button id="install-button" type="button" class="secondary" hidden>安裝</button>
        <button id="install-dismiss" type="button" class="link">不用了</button>
      </div>
    </div>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <p class="hint">所有欄位皆為必填。示範系統請勿填寫真實姓名。</p>

      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人</label>
          <input id="reporter_name" name="reporter_name" type="text"
                 maxlength="50" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="location">地點或部門</label>
          <input id="location" name="location" type="text"
                 maxlength="100" required>
        </div>

        <fieldset class="field">
          <legend>類別</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="category" value="設備" required><span>設備</span></label>
            <label class="choice"><input type="radio" name="category" value="網路"><span>網路</span></label>
            <label class="choice"><input type="radio" name="category" value="環境"><span>環境</span></label>
            <label class="choice"><input type="radio" name="category" value="其他"><span>其他</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="description">問題說明</label>
          <textarea id="description" name="description" rows="4"
                    maxlength="1000" required></textarea>
          <div class="counter"><span id="description-count">0</span> / 1000</div>
        </div>

        <fieldset class="field">
          <legend>緊急程度</legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="urgency" value="低" required><span>低</span></label>
            <label class="choice"><input type="radio" name="urgency" value="中" checked><span>中</span></label>
            <label class="choice"><input type="radio" name="urgency" value="高"><span>高</span></label>
          </div>
        </fieldset>

        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>

        <button id="submit-button" type="submit" class="primary">送出報修</button>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button id="refresh-button" type="button" class="secondary">重新整理</button>
      </div>
      <div id="list-message" class="message" role="status" aria-live="polite" hidden></div>
      <ul id="request-list" class="request-list"></ul>
    </section>
  </main>

  <footer class="site-footer">報修登記系統（示範）</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
